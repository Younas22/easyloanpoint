# ============================================================
# Enable Virtual Hosts in XAMPP httpd.conf
# ============================================================
# In C:\xampp\apache\conf\httpd.conf, find this line:
#
#   #Include conf/extra/httpd-vhosts.conf
#
# Remove the leading '#' so it reads:
#
#   Include conf/extra/httpd-vhosts.conf
#
# Then restart Apache.
# ============================================================
