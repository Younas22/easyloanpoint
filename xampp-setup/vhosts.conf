# ============================================================
# EasyLoanPoint — XAMPP VirtualHost Configuration
# File: C:\xampp\apache\conf\extra\httpd-vhosts.conf
# ============================================================
# STEP 1: Copy the block below and APPEND it to:
#         C:\xampp\apache\conf\extra\httpd-vhosts.conf
#
# STEP 2: Add to Windows hosts file (C:\Windows\System32\drivers\etc\hosts):
#         127.0.0.1   easyloanpoint.local
#
# STEP 3: Restart Apache in XAMPP Control Panel.
#
# STEP 4: Open browser: http://easyloanpoint.local/
# ============================================================

# Default VirtualHost (keeps http://localhost working for other projects)
<VirtualHost *:80>
    DocumentRoot "C:/xampp/htdocs"
    ServerName localhost
</VirtualHost>

# EasyLoanPoint VirtualHost
<VirtualHost *:80>
    ServerName easyloanpoint.local
    ServerAlias www.easyloanpoint.local

    # Point DocumentRoot directly to Laravel's public/ folder
    DocumentRoot "E:/sv26/htdocs/easyloanpoint/public"

    <Directory "E:/sv26/htdocs/easyloanpoint/public">
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "E:/sv26/htdocs/easyloanpoint/storage/logs/apache-error.log"
    CustomLog "E:/sv26/htdocs/easyloanpoint/storage/logs/apache-access.log" combined
</VirtualHost>
